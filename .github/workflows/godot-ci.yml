name: Godot CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Import project and run core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (including Git LFS assets)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import project resources
        run: godot --headless --editor --path . --import

      - name: Run core tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/test_runner.gd 2>&1 | tee test-output.log
          if grep -Eq 'ERROR:|SCRIPT ERROR:|Assertion failed' test-output.log; then
            echo "Godot reported an error or failed assertion."
            exit 1
          fi
